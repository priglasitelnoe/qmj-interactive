.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(16px,2vw,30px) 16px 22px;position:relative}
.top{text-align:center;width:min(970px,100%);z-index:1}.eyebrow{display:inline-block;background:#fff9f0d9;border:1px solid #fff;border-radius:40px;padding:6px 19px;font-size:clamp(11px,1.25vw,15px);font-weight:900;letter-spacing:.12em;color:#a27085;box-shadow:0 5px 24px #795b9b16}
h1{font-size:clamp(30px,4.1vw,57px);line-height:1.05;margin:13px 0 9px;color:#65417f;text-shadow:0 3px #fff9,0 6px 22px #fff;letter-spacing:-.04em}.intro{margin:0 auto 13px;font-size:clamp(14px,1.45vw,19px);font-weight:800;color:#7b5a7c;text-shadow:0 1px #fff}
.stats{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px;margin:8px auto 14px}.stat{border-radius:30px;background:#ffffffd9;box-shadow:0 5px 14px #906f8224;border:1.5px solid #fff;padding:7px 16px;font-weight:900;font-size:clamp(12px,1.08vw,15px);display:flex;align-items:center;gap:7px}.stat span{color:#916aba}.stat .mini{width:24px;height:24px;object-fit:contain}.stat.total{background:#72549ded;color:white}.stat.total span{color:#fff}.stat.done{background:#fff6d4}
.stage{width:min(1070px,93vw);position:relative;flex:1;display:flex;justify-content:center;align-items:center;min-height:300px}.envelopes{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(10px,1.9vw,24px);align-content:center;justify-items:center;padding:0 10px 18px}
.env{border:0;background:transparent;padding:0;width:min(100%,125px);aspect-ratio:1.26;position:relative;filter:drop-shadow(0px 9px 4px #674a7b28);transition:transform .23s ease,filter .23s ease;animation:rise .45s both;animation-delay:calc(var(--i) * 32ms)}.env:hover:not(:disabled){transform:translateY(-10px) rotate(-3deg) scale(1.06);filter:drop-shadow(0px 12px 10px #b48bbc77)}.env:active:not(:disabled){transform:scale(.95)}
.env:before{content:"";position:absolute;inset:23% 3% 3%;border-radius:8px 8px 12px 12px;background:linear-gradient(145deg,#f6cfe2,#d9acdb 70%,#c9a2d2);box-shadow:inset 0 -6px 0 #b383bf44,border-box}
.env .flap{position:absolute;top:16%;left:3%;width:94%;height:51%;background:linear-gradient(160deg,#fff2ec,#e5c0dc);clip-path:polygon(0 0,100% 0,50% 87%);filter:drop-shadow(0px 2px 2px #bf8cbb)}
.env .front{position:absolute;inset:24% 3% 3%;background:linear-gradient(135deg,#ffe7ed 0%,#eac9e6 52%,#ffe5ed 100%);clip-path:polygon(0 0,50% 47%,100% 0,100% 100%,0 100%);border-radius:0 0 10px 10px}.env .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(130deg,#ffc76b,#ef8ea1);color:white;width:clamp(29px,3vw,42px);height:clamp(29px,3vw,42px);border-radius:50%;display:grid;place-items:center;border:3px solid #fff4da;box-shadow:0 4px 5px #ad7e9444;font-weight:900;font-size:clamp(13px,1.25vw,18px)}
.env.opened{opacity:.51;filter:grayscale(.25) drop-shadow(0 4px 2px #674a7b14);cursor:default}.env.opened .seal{background:#9da3b8}.env.opened:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#5c8f7a;font-weight:900;pointer-events:none;text-shadow:0 2px white}.env.opened .seal{opacity:0}
.footer{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding-top:8px}.action{border:0;border-radius:25px;background:#fff9f4e8;color:#76548c;font-weight:900;padding:10px 19px;box-shadow:0 5px 16px #76548c26}.action:hover{background:white}.hint{color:#755e88;font-size:13px;font-weight:800;text-shadow:0 1px white}
.overlay{position:fixed;inset:0;background:#3d24568c;backdrop-filter:blur(7px);display:grid;place-items:center;z-index:20;padding:20px;animation:fade .22s ease}.overlay[hidden]{display:none}.reveal{background:linear-gradient(160deg,#fffefa,#fff0f7);border:5px solid #fff;border-radius:32px;box-shadow:0 20px 70px #4a245c73;width:min(460px,95vw);text-align:center;padding:20px 22px 24px;position:relative;animation:pop .42s cubic-bezier(.2,1.4,.4,1)}.reveal:before{content:'✦  ✧  ✦';position:absolute;left:12%;top:10%;color:#edc375;letter-spacing:40px;opacity:.85}.reveal img{display:block;width:min(205px,48vw);height:min(205px,48vw);object-fit:contain;margin:0 auto -4px;filter:drop-shadow(0 8px 12px #be9e7433);animation:bounce 1.7s ease-in-out infinite}.celebrate{font-size:12px;letter-spacing:.22em;color:#b78d9c;font-weight:900;text-transform:uppercase;margin:3px 0 4px}.reveal h2{font-size:clamp(29px,5vw,42px);line-height:1.05;color:#674480;margin:8px 0}.role-label{font-size:13px;color:#8e738c;font-weight:800;margin:10px 0 0}.role{display:inline-block;background:#f0e2fb;color:#654381;border-radius:15px;padding:9px 25px;font-size:19px;font-weight:900;margin:6px 0 17px}.next{border:0;background:linear-gradient(130deg,#9569d0,#7950b8);color:white;padding:12px 45px;border-radius:18px;font-weight:900;font-size:19px;box-shadow:0 5px 0 #573984;transition:transform .15s}.next:hover{transform:translateY(-2px)}.next:active{transform:translateY(3px);box-shadow:none}
.done-note{text-align:center;background:#fffcf0e8;padding:13px 22px;border:2px solid white;border-radius:22px;box-shadow:0 6px 24px #76548c24;font-size:clamp(16px,2vw,23px);font-weight:900;color:#6f4c89;grid-column:1/-1;align-self:center}.done-note small{display:block;font-size:13px;margin-top:6px;color:#866e8e}.recap{display:none;margin:0 auto 10px;font-weight:900;background:#fff9e9d9;border:1px solid white;border-radius:15px;padding:7px 12px;color:#715982;font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.65) rotate(-4deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@media (max-width:720px){body{background-attachment:scroll}.app{padding:20px 10px}.stage{width:100%;min-height:350px}.envelopes{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px}.env{width:min(100%,100px)}.stats{gap:5px}.stat{padding:6px 10px}.hint{max-width:350px;text-align:center}.intro{max-width:330px}.footer{padding-top:12px}}
@media (min-width:900px) and (max-height:780px){.app{padding-top:11px}.eyebrow{padding:4px 13px}h1{margin:7px 0 5px;font-size:42px}.intro{margin-bottom:5px}.stats{margin:3px auto 7px}.env{width:min(100%,108px)}.stage{min-height:250px}.envelopes{gap:7px 20px}.footer{padding-top:0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.stats{margin:0 auto 4px;gap:9px}.stat{padding:6px 13px}
.stage{width:min(1140px,96vw);min-height:0;flex:1;align-items:center}
.envelopes{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;column-gap:clamp(15px,2.5vw,40px);row-gap:clamp(3px,.55vh,12px);padding:5px 0 10px;width:min(1040px,100%)}
